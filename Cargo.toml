[workspace]
members = ["programs/*"]
resolver = "2"

# Phase 47: the Solana/Agave version the verifiable build image uses (solana-verify build). Keep it
# equal to solana_version in Anchor.toml.
[workspace.metadata.cli]
solana = "3.1.10"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
