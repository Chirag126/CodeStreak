[package]
name = "codestreak"
version = "0.1.0"
description = "CodeStreak escrow, verification and settlement program (Solana devnet)"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "codestreak"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Checked by Anchor's #[program] macro; declared so the build has no unexpected-cfg warnings.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "1.1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
