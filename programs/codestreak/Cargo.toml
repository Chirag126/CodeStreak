[package]
name = "codestreak"
version = "0.1.0"
description = "CodeStreak escrow, verification and settlement program (Solana devnet)"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "codestreak"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Checked by Anchor's #[program] macro; declared so the build has no unexpected-cfg warnings.
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
# init-if-needed: the sponsor receipt accumulates across contributions (guarded by `contributions == 0`).
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"

# In-process Solana VM tests (Anchor 1.x default). Run after `anchor build`:  cargo test -p codestreak
[dev-dependencies]
litesvm = "0.11"
litesvm-token = "0.11"
solana-account = "3.2"
solana-keypair = "3.1"
solana-message = "3.0"
solana-signer = "3.0"
solana-transaction = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
