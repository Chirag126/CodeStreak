name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lockfile is committed yet (it is created by the first local `pnpm install`).
      # Switch to --frozen-lockfile and add `cache: pnpm` above once pnpm-lock.yaml is committed.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: pnpm check (secrets, typecheck, lint, test, build)
        run: pnpm check

  program:
    name: anchor build (Solana program)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libudev-dev libssl-dev llvm libclang-dev protobuf-compiler

      # Same official installer used for local setup (Rust, Solana CLI, Anchor via AVM).
      - name: Install Solana toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          rustc --version
          solana --version
          anchor --version

      - name: anchor build
        run: anchor build

      - name: Program artifacts
        run: ls -la target/deploy target/idl target/types

      # The IDL and its TypeScript type, for the typed client in packages/shared.
      - uses: actions/upload-artifact@v4
        with:
          name: program-idl
          path: |
            target/idl/codestreak.json
            target/types/codestreak.ts
          if-no-files-found: error

      # Same files as base64 in the log, so they can be read without artifact download access.
      - name: IDL (base64)
        run: |
          echo "IDL_JSON_B64_BEGIN"; base64 -w 120 target/idl/codestreak.json; echo; echo "IDL_JSON_B64_END"
          echo "IDL_TS_B64_BEGIN"; base64 -w 120 target/types/codestreak.ts; echo; echo "IDL_TS_B64_END"

      # Unit tests (validation, lifecycle) + LiteSVM integration tests against the built .so.
      - name: Program tests
        run: cargo test -p codestreak -- --nocapture

      # Last, so a program change still prints its IDL and runs its tests in the same run.
      # The typed client in packages/shared must use exactly this IDL.
      - name: IDL in packages/shared is up to date
        run: node scripts/sync-idl.mjs --check

  database:
    name: Database migrations + constraint tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-ins (auth schema, API roles)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/00_ci_bootstrap.sql
      - name: Apply migrations in order
        run: for f in $(ls supabase/migrations/*.sql | sort); do echo "== $f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: Constraint and RLS tests
        run: for f in $(ls supabase/tests/*_test.sql | sort); do echo "== $f"; psql -v ON_ERROR_STOP=1 -f "$f"; done
